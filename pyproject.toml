[project]
name = "demand-forecasting-lstm"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandas-stubs>=3.1.0.261029",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "tensorflow>=2.21.0",
    "torch>=2.15.0",
]

# uv installs this group automatically
# with `uv sync`. pip users: `pip install -r requirements-dev.txt`.
[dependency-groups]
dev = [
    "ruff>=0.17.3,<0.18",
    "scikit-learn-stubs>=0.0.3",
]

[tool.basedpyright]
typeCheckingMode = "strict"
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportAny = false

# Ruff: the de-facto standard for Python lint+format (Black-compatible).
# One config, shared by IDEs, CLI, and CI. Docs: https://docs.astral.sh/ruff
# 88 is Black's line length; ruff format matches it exactly.
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, C4 comprehensions, RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.isort]
combine-as-imports = true
